version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: sentinel-grid-backend
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./backend/sample_videos:/app/backend/sample_videos
      - ./sentinel.db:/app/sentinel.db
    environment:
      - PYTHONUNBUFFERED=1
      - SENTINEL_DB_PATH=/app/sentinel.db
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: sentinel-grid-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
